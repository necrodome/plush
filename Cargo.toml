# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "plush"
version = "0.2.0"
edition = "2021"

# Declare both binary and library targets
[lib]
name = "plush"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "plush"
path = "src/main.rs"
required-features = ["sdl"]

[dependencies]
# SDL2 is optional - only needed for native builds with graphics/audio
sdl2 = { version = "0.38.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Wasm dependencies - only needed for WebAssembly builds
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[features]
default = ["sdl"]
sdl = ["dep:sdl2"]
count_insns = []

[profile.dev]
debug = true
opt-level = 3
overflow-checks = true
debug-assertions = true

[profile.release]
debug = false
# Enable all optimizations for maximum performance
opt-level = 3
codegen-units = 1
lto = true
# For now, we leave overflow checks and debug assertions
# enabled in release mode for security reasons
overflow-checks = true
debug-assertions = true
